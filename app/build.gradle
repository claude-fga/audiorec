plugins {
    id 'com.android.application'
}

android {
    namespace 'com.claudefga.audiorec'
    compileSdk 34

    defaultConfig {
        applicationId 'com.claudefga.audiorec'
        minSdk 29
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // WebDAV needs MKCOL/PROPFIND, which HttpURLConnection cannot send.
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
